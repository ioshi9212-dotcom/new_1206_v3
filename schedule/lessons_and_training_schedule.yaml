id: lessons_and_training_schedule_1206
status: active_flexible_windows
purpose: "Занятия и тренировки как часть взрослой рабочей базы, а не школа и не ежедневное принуждение."

lessons:
  - category: tactical_lesson
    normal_window: "до 16:00"
    purpose: "меньше ошибок, случайных жертв и неверных решений в поле"
    attendance: "по назначению, задаче, уровню подготовки или последствиям прошлых ошибок"

  - category: energy_control_lesson
    normal_window: "до 16:00 или отдельное безопасное окно"
    purpose: "меньше эмоциональных и энергетических срывов; лучше распознавание перегруза"
    attendance: "не автоматически для всех; нужен state/инструктор/причина"

trainings:
  - category: personal_training
    normal_window: "утро или день; вечером по желанию"
    purpose: "разрядка накопленной энергии, техника, выносливость"

  - category: squad_training
    normal_window: "до 16:00"
    purpose: "связность отряда, реакции, прикрытие, снижение риска потерь"
    exact_time_rule: "Не выдумывать точный час без календаря/state."

  - category: recovery_plan
    normal_window: "по состоянию"
    purpose: "сон, меднаблюдение, лёгкая нагрузка или пауза после рейда/срыва"
    accounting: "Считается содержательным блоком, если реально обоснован состоянием, а не используется как вечная отговорка."

effects:
  - "Регулярная тренировка снижает риск энергетической перегрузки, но не делает персонажа неуязвимым."
  - "Занятия снижают вероятность ошибок, жертв и импульсивных энергетических реакций, но не гарантируют успех."
  - "Пропуск увеличивает риск только как давление; конкретный срыв/ошибка требует сценического основания."

forbidden:
  - "автоматически загонять всех на тренировку"
  - "делать базу школой"
  - "наказывать за отдельный отдых, еду, разговор или сон"
  - "назначать точный урок задним числом только ради удобства сцены"
