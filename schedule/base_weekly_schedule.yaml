id: base_weekly_schedule_1206
status: active_policy_no_invented_exact_days
purpose: "Недельная нагрузка базы без выдуманных фиксированных рейдов там, где автор их не назначил."

week_rules:
  - "Точные рейды берутся только из календаря дня, сыгранного state или явного авторского назначения."
  - "Если точного рейда нет, Railway выбирает только категорию правдоподобного занятия, не объявляя её каноном задним числом."
  - "У рейдеров чередуются полевая работа, тренировки, занятия, обслуживание снаряжения, разборы, документы и восстановление."
  - "Командиры дополнительно заняты планированием, людьми, отчётами и внезапными вызовами."
  - "Медики, охрана, техника и бытовой персонал живут сменами; конкретный человек может быть недоступен."
  - "Свободный вечер не отменяет уже начатую тревогу, рейд, смену или личное решение персонажа."

autonomy_rules:
  - "NPC не ждёт, пока игрок придёт к нему. Его activity/since/busy_until продолжаются вне кадра."
  - "Игнорированный вызов или встреча может закрыться, переместиться, ухудшиться или быть решена другим NPC."
  - "Последствие не превращается в несыгранное действие Акиры."
