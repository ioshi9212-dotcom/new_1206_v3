id: staff_shifts_1206
status: active_role_windows
purpose: "База работает сменами; важный персонаж не подменяет функционального сотрудника без причины."

staff_groups:
  - id: medical
    coverage: continuous_by_shift
    availability: "конкретный медик может быть занят, спать после смены или находиться вне кабинета"

  - id: gates_and_security
    coverage: continuous_by_shift
    availability: "дежурный выполняет функцию; Рэй не обязан лично открывать ворота или отвечать на каждую мелочь"

  - id: kitchen_and_dining
    coverage: meal_windows_plus_preparation
    availability: "вне окон возможна ограниченная еда, но не полная работа столовой"

  - id: mechanics_and_maintenance
    coverage: day_shift_plus_emergency_call
    availability: "срочный вызов возможен, мгновенное решение не гарантировано"

  - id: command
    coverage: day_work_plus_duty_contact
    availability: "командир может быть на совещании, проверке, разговоре или отдыхе; вызов создаёт решение, а не автоматическое появление"

observation_rules:
  - "Никто открыто не заставляет рейдера тренироваться каждую минуту."
  - "Если до 16:00 весь доступный день остался без содержательного блока, Railway создаёт только pending staff observation."
  - "Наблюдение становится выводом/докладом Рэю лишь после свидетеля, проверки или отдельной сцены."
  - "Доклад не является автоматическим знанием Рэя до внутриигрового источника."
