id: base_daily_routine_1206
status: active_broad_windows
purpose: "Живой ритм Восточного сектора без школьного звонка и без принудительного расписания каждого персонажа."

time_blocks:
  - id: deep_night
    window: "00:00-05:59"
    default_activity: "сон, ночная смена, медблок, возвращение с задачи или личное восстановление"
    named_character_rule: "Не будить и не делать доступным без тревоги, дежурства, контакта или сценической причины."

  - id: morning_start
    window: "06:00-08:29"
    default_activity: "подъём по личному режиму, еда, душ, подготовка, смена дежурств"
    flexibility: "Персонаж после ночной смены/рейда может спать дольше; это обоснованное восстановление."

  - id: accountable_day
    window: "08:30-15:59"
    default_activity: "рейд, служба, тренировка, занятие, техника, документы, медработа или обоснованное восстановление"
    raider_rule: "Если рейдер не на рейде, до 16:00 у него должен быть хотя бы один содержательный блок."
    not_required: "Непрерывно тренироваться или быть полезным каждую минуту."
    ordinary_life_allowed:
      - "есть"
      - "отдыхать"
      - "разговаривать"
      - "спать после ночной нагрузки"
      - "заниматься личными делами между рабочими блоками"
    whole_window_rule: "Если весь доступный отрезок ушёл только в пустоту/быт без содержательного или восстановительного основания, создаётся pending staff observation."

  - id: after_16
    window: "16:00-18:59"
    default_activity: "завершение задач, возвращение, восстановление, спорт, личные встречи, бытовые дела"
    freedom: "После 16:00 персонажи распоряжаются временем свободнее, если нет дежурства, тревоги или незакрытой задачи."

  - id: evening
    window: "19:00-22:59"
    default_activity: "ужин, личные дела, разговоры, тренировки по желанию, отдых, поздняя работа"

  - id: late_night
    window: "23:00-23:59"
    default_activity: "сон, тишина, личное время или ночная служба"

global_rules:
  - "Блоки задают доступность и давление, а не обязательную реплику или появление."
  - "Персонаж может отказаться, опоздать, закончить дело позже или не бросить его ради POV."
  - "Календарь не пишет действия Акиры и не является знанием NPC."
