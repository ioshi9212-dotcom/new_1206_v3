name: Install session recovery

on:
  push:
    branches:
      - agent/session-recovery-rollback

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/session-recovery-rollback
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Integrate recovery into existing owners
        run: python tools/install_session_recovery.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Compile runtime and tests
        run: python -m compileall -q app tests
      - name: Run full regression suite
        run: PYTHONPATH=. pytest -q --tb=short
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add revision snapshots rollback and recovery audit"
          git push origin HEAD:agent/session-recovery-rollback
