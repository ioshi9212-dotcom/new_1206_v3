name: Install pending validation diagnostics

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pending-validation-diagnostics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Integrate pending validation diagnostics
        run: |
          set +e
          python tools/install_pending_validation_diagnostics.py > pending-validation-installer.txt 2>&1
          first_status=$?
          echo "Initial installer status: $first_status" >> pending-validation-installer.txt
          python tools/fix_authorization_markers.py >> pending-validation-installer.txt 2>&1
          marker_status=$?
          echo "Authorization marker fix status: $marker_status" >> pending-validation-installer.txt
          python tools/continue_pending_validation_diagnostics.py >> pending-validation-installer.txt 2>&1
          continuation_status=$?
          echo "Continuation status: $continuation_status" >> pending-validation-installer.txt
          python tools/fix_public_integrity_next_action.py >> pending-validation-installer.txt 2>&1
          public_status=$?
          echo "Public integrity fix status: $public_status" >> pending-validation-installer.txt
          python tools/preserve_state_validation_rejected_status.py >> pending-validation-installer.txt 2>&1
          compatibility_status=$?
          echo "State validation compatibility status: $compatibility_status" >> pending-validation-installer.txt
          status=$((marker_status || continuation_status || public_status || compatibility_status))
          cat pending-validation-installer.txt
          exit $status
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Compile runtime and tests
        run: python -m compileall -q app tests
      - name: Run focused pending validation tests
        run: |
          set +e
          PYTHONPATH=. pytest -q tests/test_pending_validation_diagnostics.py --tb=short > pending-validation-focused.txt 2>&1
          status=$?
          cat pending-validation-focused.txt
          exit $status
      - name: Run full regression suite
        run: |
          set +e
          PYTHONPATH=. pytest -q --tb=short > pending-validation-pytest.txt 2>&1
          status=$?
          cat pending-validation-pytest.txt
          exit $status
      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pending-validation-diagnostics
          path: |
            pending-validation-installer.txt
            pending-validation-focused.txt
            pending-validation-pytest.txt
          if-no-files-found: warn
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist pending validation diagnostics"
          git push origin HEAD:agent/pending-validation-diagnostics
