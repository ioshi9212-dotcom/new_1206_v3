name: Install quarantine repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/quarantine-repair
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Integrate quarantine repair
        run: python tools/install_quarantine_repair.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Compile runtime and tests
        run: python -m compileall -q app tests
      - name: Run full regression suite
        run: |
          set +e
          PYTHONPATH=. pytest -q --tb=short > quarantine-repair-pytest.txt 2>&1
          status=$?
          cat quarantine-repair-pytest.txt
          exit $status
      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarantine-repair-pytest
          path: quarantine-repair-pytest.txt
          if-no-files-found: error
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add quarantine-first session repair"
          git push origin HEAD:agent/quarantine-repair
